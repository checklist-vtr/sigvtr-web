<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0d47a1">
  <link rel="icon" href="assets/icons/favicon.ico?v=1.6.2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png?v=1.6.2">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png?v=1.6.2">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=1.6.2">
  <link rel="manifest" href="manifest.json?v=1.6.2">
<title>SIGVTR | Painel Administrativo</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
  <div class="admin-shell">
    <aside id="sidebar" class="sidebar" aria-label="Menu principal"></aside>

    <div class="admin-main">
      <header id="navbar"></header>

      <main class="content-wrapper">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <section class="page-header mb-4">
            <div>
              <p class="eyebrow mb-1">Visão geral</p>
              <h1 class="h3 mb-1">Dashboard</h1>
              <p class="text-secondary mb-0">
                Acompanhe rapidamente a situação operacional da frota.
              </p>
            </div>
          </section>

          <section class="row g-3 mb-4" id="kpiContainer" aria-label="Indicadores principais"></section>

          <section class="row g-4">
            <div class="col-12 col-xl-8">
              <article class="panel-card h-100">
                <div class="panel-card-header">
                  <div>
                    <h2 class="h5 mb-1">Atividade recente</h2>
                    <p class="text-secondary small mb-0">
                      Últimos registros recebidos pelo sistema.
                    </p>
                  </div>
                  <button class="btn btn-sm btn-outline-primary" type="button">
                    Ver todos
                  </button>
                </div>

                <div class="table-responsive">
                  <table class="table align-middle mb-0">
                    <thead>
                      <tr>
                        <th>Protocolo</th>
                        <th>Viatura</th>
                        <th>Responsável</th>
                        <th>Status</th>
                        <th>Horário</th>
                      </tr>
                    </thead>
                    <tbody id="recentActivity"></tbody>
                  </table>
                </div>
              </article>
            </div>

            <div class="col-12 col-xl-4">
              <article class="panel-card h-100">
                <div class="panel-card-header">
                  <div>
                    <h2 class="h5 mb-1">Pendências</h2>
                    <p class="text-secondary small mb-0">
                      Itens que exigem acompanhamento.
                    </p>
                  </div>
                </div>

                <div id="pendingList" class="pending-list"></div>
              </article>
            </div>
          </section>
        </div>
      </main>

      <footer id="footer"></footer>
    </div>
  </div>

  <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js?v=1.6.2"></script>
  <script src="assets/js/auth.js?v=1.6.2"></script>
  <script>AuthService.requireAuthentication();</script>
  <script src="assets/js/menu.js?v=1.6.2"></script>
  <script src="assets/js/admin.js?v=1.6.2"></script>
</body>
</html>
