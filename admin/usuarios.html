<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d47a1"><meta name="robots" content="noindex,nofollow"><title>SIGVTR • Usuários</title><link rel="icon" href="assets/icons/favicon.ico?v=1.20.16-rc1" sizes="any"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"><link rel="stylesheet" href="assets/css/admin.css?v=1.20.16-rc1"></head><body><div class="admin-shell"><aside id="sidebar" class="sidebar"></aside><div class="admin-main"><header id="navbar"></header><main class="content-wrapper"><div class="container-fluid px-3 px-lg-4 py-4"><div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><div><p class="eyebrow mb-1">Controle de acesso</p><h1 class="h3 mb-1">Usuários</h1><p class="text-secondary mb-0">Gestão das contas administrativas do SIGVTR.</p></div><button id="newUser" class="btn btn-primary"><i class="bi bi-person-plus me-2"></i>Novo usuário</button></div><div id="usersAlert" class="alert d-none"></div><article class="panel-card p-3"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Situação</th><th>Último login</th><th class="text-end">Ações</th></tr></thead><tbody id="usersBody"></tbody></table></div></article></div></main><footer id="footer"></footer></div></div><div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><form id="userForm" class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5">Usuário administrativo</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="userId" type="hidden"><div class="mb-3"><label class="form-label" for="userNameField">Nome</label><input id="userNameField" class="form-control" maxlength="120" required></div><div class="mb-3"><label class="form-label" for="userLoginField">Login</label><input id="userLoginField" class="form-control" minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]+" required></div><div class="mb-3"><label class="form-label" for="userRoleField">Perfil</label><select id="userRoleField" class="form-select" required><option value="CMD">CMD</option><option value="SUBCMD">SUBCMD</option><option value="FISCAL">FISCAL</option><option value="DEV">DEV</option></select></div><div class="form-check"><input id="userActiveField" class="form-check-input" type="checkbox" checked><label class="form-check-label" for="userActiveField">Usuário ativo</label></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" type="submit">Salvar</button></div></form></div></div>
<div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><form id="passwordForm" class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5">Redefinir senha</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input id="passwordUserId" type="hidden"><p id="passwordUserLabel" class="text-secondary"></p><label class="form-label" for="temporaryPassword">Nova senha temporária</label><input id="temporaryPassword" class="form-control" type="password" minlength="12" autocomplete="new-password" required><div class="form-text">A senha deverá ser alterada no próximo login. Mínimo de 12 caracteres, com maiúscula, minúscula, número e caractere especial.</div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" type="submit">Redefinir senha</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/api.js?v=1.20.16-rc1"></script><script src="assets/js/auth.js?v=1.20.16-rc1"></script><script src="assets/js/menu.js?v=1.20.16-rc1"></script><script src="assets/js/admin-layout.js?v=1.20.16-rc1"></script><script src="assets/js/usuarios.js?v=1.20.16-rc1"></script></body></html>
