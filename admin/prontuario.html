<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d47a1">
  <link rel="icon" href="assets/icons/favicon.ico?v=1.18.1-rc1" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png?v=1.18.1-rc1">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png?v=1.18.1-rc1">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=1.18.1-rc1">
  <link rel="manifest" href="manifest.json?v=1.18.1-rc1">
<title>SIGVTR • Prontuário da Viatura</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="stylesheet" href="assets/css/prontuario.css">
</head>
<body>
<div class="admin-shell">
  <aside id="sidebar" class="sidebar"></aside>

  <div class="admin-main">
    <header id="navbar"></header>

    <main class="content-wrapper">
      <div class="container-fluid px-3 px-lg-4 py-4">
        <section class="page-header mb-4">
          <div>
            <p class="eyebrow mb-1">Histórico da frota</p>
            <h1 class="h3 mb-1">Prontuário Digital da Viatura</h1>
            <p class="text-secondary mb-0">
              Consulte dados cadastrais, checklists, avarias e eventos da viatura.
            </p>
          </div>

          <div class="d-flex gap-2 flex-wrap">
          <button id="editVehicleRecordButton" class="btn btn-primary" type="button">
            <i class="bi bi-pencil me-2"></i>Editar viatura
          </button>
          <a href="avarias.html" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left me-2"></i>Voltar para avarias
          </a>
        </div>
        </section>

        <section class="panel-card mb-4">
          <div class="p-3 p-lg-4">
            <div class="row g-3 align-items-end">
              <div class="col-12 col-lg-5">
                <label class="form-label" for="vehicleSelector">Selecionar viatura</label>
                <select id="vehicleSelector" class="form-select form-select-lg"></select>
              </div>

              <div class="col-12 col-lg-7">
                <div class="vehicle-header" id="vehicleHeader"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="row g-3 mb-4" id="vehicleKpis"></section>

        <section class="panel-card">
          <div class="p-3 p-lg-4">
            <ul class="nav nav-pills prontuario-tabs mb-4" id="recordTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabResumo" type="button">
                  <i class="bi bi-grid me-2"></i>Resumo
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabAvarias" type="button">
                  <i class="bi bi-tools me-2"></i>Avarias
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabChecklists" type="button">
                  <i class="bi bi-clipboard2-check me-2"></i>Checklists
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabHistorico" type="button">
                  <i class="bi bi-clock-history me-2"></i>Histórico
                </button>
              </li>
            </ul>

            <div class="tab-content">
              <div class="tab-pane fade show active" id="tabResumo">
                <div id="summaryContent"></div>
              </div>

              <div class="tab-pane fade" id="tabAvarias">
                <div id="damageContent"></div>
              </div>

              <div class="tab-pane fade" id="tabChecklists">
                <div id="checklistContent"></div>
              </div>

              <div class="tab-pane fade" id="tabHistorico">
                <div id="historyContent"></div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer id="footer"></footer>
  </div>
</div>

<div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>

<div class="modal fade" id="editVehicleRecordModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <form id="editVehicleRecordForm" novalidate>
        <div class="modal-header">
          <div>
            <p class="eyebrow mb-1">Prontuário Digital</p>
            <h2 class="modal-title fs-5">Editar dados da viatura</h2>
          </div>
          <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>

        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <label class="form-label" for="recordPrefix">Prefixo</label>
              <input id="recordPrefix" class="form-control" required>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label" for="recordPlate">Placa</label>
              <input id="recordPlate" class="form-control" required>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label" for="recordYear">Ano</label>
              <input id="recordYear" class="form-control" type="number" min="1990" max="2100" required>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label" for="recordBrand">Marca</label>
              <input id="recordBrand" class="form-control" required>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label" for="recordModel">Modelo</label>
              <input id="recordModel" class="form-control" required>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label" for="recordCompany">Companhia</label>
              <input id="recordCompany" class="form-control" required>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label" for="recordKm">Quilometragem</label>
              <input id="recordKm" class="form-control" type="number" min="0" required>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label" for="recordFuel">Combustível (%)</label>
              <input id="recordFuel" class="form-control" type="number" min="0" max="100" required>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label" for="recordStatus">Situação</label>
              <select id="recordStatus" class="form-select" required>
                <option value="ATIVA">Ativa</option>
                <option value="MANUTENCAO">Em manutenção</option>
                <option value="RESERVA">Reserva</option>
                <option value="INATIVA">Inativa</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="recordNotes">Observações administrativas</label>
              <textarea id="recordNotes" class="form-control" rows="3"></textarea>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-primary" type="submit">
            <i class="bi bi-check2 me-2"></i>Salvar alterações
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js?v=1.18.1-rc1"></script>
<script src="assets/js/auth.js?v=1.18.1-rc1"></script>
<script src="assets/js/menu.js?v=1.18.1-rc1"></script>
<script src="assets/js/admin-layout.js?v=1.18.1-rc1"></script>
<script src="assets/js/prontuario.js?v=1.18.1-rc1"></script>
</body>
</html>
