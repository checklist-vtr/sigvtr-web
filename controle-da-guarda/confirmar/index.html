<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d47a1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>SIGVTR • Confirmar movimentação</title>
  <link rel="icon" href="../../favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/confirmar.css?v=0.8.0">
</head>
<body>
  <main class="confirm-shell">
    <section class="confirm-card">
      <div class="brand"><i class="bi bi-qr-code-scan"></i></div>
      <span class="kicker">SIGVTR • CONTROLE DA GUARDA</span>
      <div id="loadingView" class="state-view"><div class="spinner-border text-primary" role="status"></div><p>Validando confirmação...</p></div>
      <div id="errorView" class="state-view d-none"><div class="state-icon error"><i class="bi bi-exclamation-triangle"></i></div><h1>Não foi possível confirmar</h1><p id="errorMessage"></p></div>
      <div id="formView" class="d-none">
        <h1 id="operationTitle">Confirmação de retirada</h1>
        <div class="info-grid">
          <div><span>VTR</span><strong id="vtrInfo"></strong></div>
          <div><span>Condutor</span><strong id="driverInfo"></strong></div>
          <div><span>Solicitação</span><strong id="requestInfo"></strong></div>
        </div>
        <form id="confirmForm" novalidate>
          <label for="kmInput" class="form-label">KM atual da viatura</label>
          <input id="kmInput" class="form-control form-control-lg km-input" inputmode="numeric" pattern="[0-9.]*" autocomplete="off" placeholder="Ex.: 67879" required>
          <small id="lastKmInfo" class="last-km d-none"></small><small id="initialKmInfo" class="last-km d-none"></small>
          <div id="formAlert" class="alert alert-danger d-none mt-3" role="alert"></div>
          <button id="confirmButton" class="btn btn-primary btn-lg w-100 mt-3" type="submit"><span class="button-label"><i class="bi bi-check-circle me-2"></i><span id="confirmButtonText">Confirmar recebimento</span></span><span class="button-loading d-none"><span class="spinner-border spinner-border-sm me-2"></span>Confirmando...</span></button>
        </form>
        <p class="privacy-note"><i class="bi bi-shield-lock me-1"></i>Este QR autoriza somente esta confirmação.</p>
      </div>
      <div id="successView" class="state-view d-none"><div class="state-icon success"><i class="bi bi-check-lg"></i></div><h1 id="successTitle">Retirada confirmada</h1><div id="successDetails" class="success-details"></div><p class="done-note">Procedimento concluído. Você pode fechar esta página.</p></div>
    </section>
  </main>
  <script src="../../admin/assets/js/api.js?v=1.20.16-rc1"></script>
  <script src="assets/confirmar.js?v=0.8.0"></script>
</body>
</html>
