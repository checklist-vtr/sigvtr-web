<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d47a1"><title>Controle de Abastecimento · SIGVTR</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><style>body{background:#f4f7fb;color:#172033}.wrap{max-width:760px;margin:auto}.hero{background:linear-gradient(135deg,#0d47a1,#1976d2);color:#fff;border-radius:0 0 24px 24px}.card{border:0;border-radius:18px;box-shadow:0 8px 30px rgba(23,32,51,.08)}.form-control,.form-select,.btn{min-height:48px}.entry{border-left:4px solid #1976d2}.sticky-actions{position:sticky;bottom:0;background:rgba(244,247,251,.94);backdrop-filter:blur(8px);padding:12px 0}.search-results{max-height:220px;overflow:auto}.search-item{cursor:pointer}.search-item:hover{background:#eef4ff}</style></head><body><header class="hero py-4"><div class="wrap px-3"><div class="small opacity-75">20º BPM · PMPA</div><h1 class="h3 mb-1">Controle de Abastecimento</h1><div id="sessionStatus" class="small">Preparando sessão...</div></div></header><main class="wrap px-3 py-4"><div id="msg" class="alert" hidden></div><section class="card p-3 p-md-4 mb-3"><h2 class="h5 mb-3">Registrar abastecimento</h2><form id="fuelForm"><div class="mb-3"><label class="form-label">Viatura</label><select id="vehicle" class="form-select" required><option value="">Carregando...</option></select><div id="cardInfo" class="form-text"></div></div><div class="row g-3"><div class="col-6"><label class="form-label">KM</label><input id="km" class="form-control" type="number" min="0" inputmode="numeric" required></div><div class="col-6"><label class="form-label">Litros</label><input id="litros" class="form-control" type="number" min="0.01" step="0.01" inputmode="decimal" required></div><div class="col-6"><label class="form-label">Tanque</label><select id="tanque" class="form-select" required><option value="">Selecione</option><option>RESERVA</option><option>1/4</option><option>-1/2</option><option>1/2</option><option>+1/2</option><option>3/4</option><option>CHEIO</option></select></div><div class="col-6"><label class="form-label">Saldo atualizado</label><div class="input-group"><span class="input-group-text">R$</span><input id="saldo" class="form-control" type="number" min="0" step="0.01" inputmode="decimal" required></div></div></div><div class="mt-3 position-relative"><label class="form-label">Motorista</label><input id="driverSearch" class="form-control" placeholder="Digite nome, nome de guerra ou RG" autocomplete="off" required><input id="driverId" type="hidden"><div id="driverResults" class="list-group search-results position-absolute w-100 shadow" style="z-index:10"></div></div><button id="saveBtn" class="btn btn-primary w-100 mt-4" type="submit"><i class="bi bi-fuel-pump me-2"></i>Registrar abastecimento</button></form></section><section class="card p-3 p-md-4 mb-3"><div class="d-flex justify-content-between"><h2 class="h5">Abastecimentos desta sessão</h2><span id="count" class="badge text-bg-primary">0</span></div><div id="entries" class="mt-2 text-secondary">Nenhum abastecimento registrado.</div></section><div class="sticky-actions"><button class="btn btn-success w-100" data-bs-toggle="modal" data-bs-target="#closeModal"><i class="bi bi-check2-circle me-2"></i>Encerrar abastecimento</button></div></main><div class="modal fade" id="closeModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form id="closeForm"><div class="modal-header"><h2 class="modal-title h5">Encerrar abastecimento</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Abastecedor responsável</label><input id="closerSearch" class="form-control" placeholder="Digite nome, nome de guerra ou RG" autocomplete="off" required><input id="closerId" type="hidden"><div id="closerResults" class="list-group search-results"></div><label class="form-label mt-3">Observação geral (opcional)</label><textarea id="obs" class="form-control" rows="3"></textarea></div><div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Voltar</button><button id="closeBtn" class="btn btn-success" type="submit">Encerrar e gerar PDF</button></div></form></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="app.js"></script></body></html>
